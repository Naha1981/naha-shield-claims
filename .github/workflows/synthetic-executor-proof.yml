name: Synthetic executor proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-browser-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run lint && npm test && npm run build
      - run: npm ci --prefix portal-runner --ignore-scripts
      - run: npx --prefix portal-runner playwright install --with-deps chromium
      - run: npm --prefix portal-runner test && npm --prefix portal-runner run e2e
        env:
          PORTAL_RUNNER_CHROME: /nonexistent/use-playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-executor-proof
          path: |
            portal-runner/evidence/e2e-proof-results.json
            portal-runner/evidence/*.png
          retention-days: 1
