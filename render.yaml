services:
  - type: web
    name: nahashield-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NAHASHIELD_REGION
        value: demo-render-synthetic-only
      - key: NAHASHIELD_ORG_ID
        value: org_sa_partner_01
      - key: DATABASE_URL
        fromDatabase:
          name: nahashield-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: nahashield-db
    plan: free
    databaseName: nahashield
    user: nahashield_app
