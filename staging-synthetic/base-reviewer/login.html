<!doctype html><meta charset="utf-8"><title>Private reviewer sign-in</title><style>body{font:18px system-ui;max-width:440px;margin:12vh auto;background:#0c1423;color:#e5edfa}input,button{box-sizing:border-box;padding:14px;width:100%;margin:10px 0}small{color:#adbed4}</style><h1>Private reviewer sign-in</h1><p>Synthetic evidence test. Only the enrolled reviewer can enter.</p><form id="f"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><p id="r"></p><small>No claimant data. No insurance decision or external action.</small><script>f.onsubmit=async e=>{e.preventDefault();const q=await fetch('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});if(q.ok)location.href='/';else r.textContent='Sign-in failed or reviewer not enrolled.';}</script>
